<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang thể thao Việt Nam đang được triển khai trên domain loto188.com với trải nghiệm nhanh, an toàn và dễ truy cập." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#071a2e" />
    <meta property="og:title" content="Trang thể thao đang được chuẩn bị" />
    <meta property="og:description" content="Trang thể thao Việt Nam đang được triển khai trên domain loto188.com." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loto188.com" />
    <meta name="twitter:card" content="summary" />
    <meta http-equiv="refresh" content="3;url=https://l188.online/" />
    <link rel="canonical" href="https://loto188.com" />
    <link rel="manifest" href="/manifest.json" />
    <title>loto188.com | Đang chuyển hướng...</title>
    <style>
      :root {
        --bg: #071a2e;
        --panel: rgba(255, 255, 255, 0.95);
        --text: #0f172a;
        --accent: #f59e0b;
        --accent-2: #2563eb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #102d4e);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        background: var(--panel);
        border-radius: 24px;
        padding: 32px;
        max-width: 560px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .badge {
        display: inline-block;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: #334155;
      }

      ul {
        margin: 0 0 18px;
        padding-left: 20px;
        text-align: left;
        color: #334155;
      }

      li + li {
        margin-top: 8px;
      }

      .note {
        font-size: 0.95rem;
        color: #64748b;
        margin-top: 8px;
      }

      .countdown {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--accent);
        margin-top: 16px;
      }

      .btn {
        display: inline-block;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin-top: 12px;
        border: none;
        cursor: pointer;
        transition: opacity 0.3s;
      }

      .btn:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">⚽ Thể thao &amp; Cơ hội</div>
      <h1>Đang chuyển hướng...</h1>
      <p>Ứng dụng sẽ tự động chuyển hướng đến trang chính trong vài giây.</p>
      <p>Nếu bạn không được chuyển hướng tự động, vui lòng nhấn nút dưới đây:</p>
      <a href="https://l188.online/" class="btn">Truy cập ngay →</a>
      <div class="countdown">Chuyển hướng trong: <span id="countdown">3</span>s</div>
    </div>

    <script>
      let seconds = 3;
      const countdownElement = document.getElementById('countdown');

      // Cập nhật bộ đếm ngược
      const interval = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
        }
      }, 1000);

      // Chuyển hướng sau 3 giây
      setTimeout(() => {
        window.location.href = 'https://l188.online/';
      }, 3000);
    </script>
  </body>
</html>
